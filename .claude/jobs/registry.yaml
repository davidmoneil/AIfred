# AIfred Jobs — Headless Claude Job Registry
# ============================================
# All scheduled and on-demand headless jobs are defined here.
# The dispatcher reads this file every cycle to determine what to run.
#
# Adding a new job:
#   1. Create a persona in personas/<name>/ (or reuse an existing one)
#   2. Add an entry below with schedule, budget, and prompt
#   3. The dispatcher picks it up automatically on next cycle
#
# Engine routing (optional):
#   engine: claude-code   # Default. Uses `claude -p` with persona tools/permissions.
#   engine: ollama        # Uses local Ollama API. Free, fast, no tool use.
#   Resolution order: job.engine > persona config engine.default > defaults.engine > "claude-code"
#
# Schedule types:
#   type: interval    — Run every N hours (every_hours: 6)
#   type: daily       — Run once per day (hour: 14)
#   type: weekly      — Run once per week (day: monday, hour: 9)
#   type: on-demand   — Never auto-runs, triggered via webhook or manual dispatch
#
# Pre-checks:
#   pre_check: "bash command"  — Runs BEFORE LLM invocation. If exit != 0, job is skipped.
#   Use this to avoid expensive LLM calls when there's nothing to do.

version: 1

# Notification quiet hours — prevents non-critical alerts during sleep
# Customize timezone and hours to match your schedule
quiet_hours:
  timezone: "America/Denver"  # Change to your timezone
  weekday:
    start: 22    # 10 PM
    end: 7       # 7 AM
  weekend:
    start: 23    # 11 PM
    end: 9       # 9 AM
  severity_bypass:
    - critical   # Critical always delivers immediately
  batch_release: true  # Send queued messages when DND ends

# Default values for all jobs (override per-job as needed)
defaults:
  engine: claude-code
  model: sonnet
  max_turns: 10
  max_budget_usd: 2.00
  timeout_minutes: 10
  session_persist: false
  max_retries: 1
  retry_backoff_hours: 1

# ─────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────
jobs:

  # ── Health Check ────────────────────────────────
  # Quick infrastructure health check. Runs every 6 hours.
  # Uses the read-only investigator persona.
  health-check:
    description: "Quick infrastructure health check"
    persona: investigator
    schedule:
      type: interval
      every_hours: 6
    enabled: true
    max_turns: 10
    max_budget_usd: 1.00
    pre_check: "docker ps >/dev/null 2>&1"  # Skip if Docker isn't running
    prompt: |
      Check infrastructure health. Run:
        docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.State}}'
      Verify all containers are running and healthy. If any service is down,
      unhealthy, or restarting, use docker inspect for details.
      Output a brief health summary listing each service and its status.
      Keep it concise — one line per service.

  # ── Task Scoring ────────────────────────────────
  # Labels unlabeled Beads tasks with auto: and risk: labels.
  # On-demand — run when you have new tasks to classify.
  task-score:
    description: "Label unlabeled Beads tasks with automation and risk scores"
    persona: task-investigator
    schedule:
      type: on-demand
    enabled: true
    max_turns: 15
    max_budget_usd: 1.50
    pre_check: "test -n \"$(bd list --status open --plain 2>/dev/null | head -1)\""
    prompt: |
      Review open Beads tasks that lack auto: or risk: labels.
      Run: bd list --status open --plain
      For each task without auto: and risk: labels, evaluate it against
      the scoring rules in .claude/jobs/lib/autofix-scoring-rules.md.
      Apply labels using: bd update <id> --add-label "auto:<level>" --add-label "risk:<level>"

      Label definitions:
        auto:ready — Specific, deterministic, no external deps
        auto:candidate — Likely automatable, needs investigation
        auto:blocked — Requires human judgment or design decisions
        risk:safe — Fully reversible (renames, metadata, temp files)
        risk:moderate — Reversible with effort (multi-file edits, configs)
        risk:destructive — Irreversible (content deletion, API calls, git push)

  # ── Task Investigator ───────────────────────────
  # Evaluates auto:candidate tasks and promotes to auto:ready or blocks.
  task-investigator:
    description: "Evaluate task automation readiness and promote or block"
    persona: task-investigator
    schedule:
      type: interval
      every_hours: 4
    enabled: true
    max_turns: 15
    max_budget_usd: 1.50
    pre_check: "test -n \"$(bd list --status open --label auto:candidate --plain 2>/dev/null | head -1)\""
    prompt: |
      Review tasks labeled auto:candidate and determine if they can be automated.
      Run: bd list --status open --label auto:candidate --plain
      For each task, evaluate against .claude/jobs/lib/autofix-scoring-rules.md:
        1. Is the action specific and deterministic?
        2. Are the target files/paths known and scoped?
        3. Are there external dependencies?
        4. Is the action reversible?
      Promote to auto:ready if safe, or mark auto:blocked with reasoning.
      Use: bd update <id> --remove-label "auto:candidate" --add-label "auto:ready"
      Or:  bd update <id> --remove-label "auto:candidate" --add-label "auto:blocked"

  # ── Task Executor ───────────────────────────────
  # Executes auto:ready + risk:safe tasks autonomously.
  # Safety: 3-min timeout per task, max 10 per run, git stash before changes.
  task-executor:
    description: "Execute safe automated tasks"
    persona: autofix-executor
    schedule:
      type: interval
      every_hours: 6
    enabled: true
    max_turns: 30
    max_budget_usd: 2.50
    timeout_minutes: 15
    pre_check: "test -n \"$(bd list --status open --label auto:ready --label risk:safe --plain 2>/dev/null | head -1)\""
    prompt: |
      Execute tasks that are labeled auto:ready AND risk:safe.
      Run: bd list --status open --label auto:ready --label risk:safe --plain
      For each task (up to 10 per run):
        1. Read the task description: bd show <id>
        2. Claim it: bd update <id> --status in_progress --claim
        3. Execute the described action
        4. If successful: bd close <id> --reason "Auto-fixed: <what was done>"
        5. If failed or uncertain: bd update <id> --status open --add-label "auto:blocked"
           and add a comment explaining why

      SAFETY CONSTRAINTS:
        - Maximum 10 tasks per run
        - 3-minute timeout per individual task
        - Never delete user content or media files
        - Never run Docker operations or git push
        - Never modify files outside the project directory
        - If unsure, mark as auto:blocked rather than attempting

  # ── Weekly Cost Report ──────────────────────────
  # Summarizes job spending for the past week.
  weekly-cost-report:
    description: "Summarize weekly job costs and performance"
    persona: analyst
    schedule:
      type: weekly
      day: monday
      hour: 9
    enabled: true
    max_turns: 8
    max_budget_usd: 0.50
    prompt: |
      Generate a weekly cost report for headless jobs.
      Run: .claude/jobs/lib/cost-report.sh --period weekly --json
      Summarize: total spend, top 3 most expensive jobs, any budget overruns,
      job success/failure rates. Keep it to 5-10 lines.

  # ── Doc Sync Check ─────────────────────────────
  # Checks if documentation needs updating based on recent code changes.
  doc-sync-check:
    description: "Check if documentation needs sync with code changes"
    persona: investigator
    schedule:
      type: interval
      every_hours: 24
    enabled: true
    max_turns: 6
    max_budget_usd: 0.50
    prompt: |
      Read .claude/logs/.doc-sync-state.json (if it exists). This file is
      created by the doc-sync-trigger hook and tracks code changes. If the
      file exists and has 5+ changes in its "changes" array from the last
      24 hours, list which documentation files may need updating. If fewer
      than 5 changes, the file doesn't exist, or the changes array is empty,
      simply output "No sync needed — no significant changes detected." and
      stop. Do not modify any files.

  # ── Priority Review ─────────────────────────────
  # Weekly task hygiene — flags stale or stuck items.
  priority-review:
    description: "Review Beads tasks and flag stale items"
    persona: investigator
    schedule:
      type: weekly
      day: monday
      hour: 7
    enabled: true
    max_turns: 15
    max_budget_usd: 1.50
    prompt: |
      Review current task state using Beads. Run:
        bd list --status open    (all open tasks)
        bd list --status in_progress  (active work)
      Read .claude/context/session-state.md for current status. Identify tasks
      that appear stale or have been in_progress for a long time without activity.
      Output a summary of recommendations. Do not modify any files or tasks.

  # ── Ollama Test (disabled) ─────────────────────
  # Example Ollama job for testing engine routing.
  # Enable this to verify your Ollama setup works with the dispatcher.
  ollama-test:
    description: "Test Ollama engine routing (lightweight summary)"
    engine: ollama
    model: "llama3.2"
    persona: investigator
    schedule:
      type: on-demand
    enabled: false
    timeout_minutes: 5
    prompt: |
      Summarize the current date and time, and respond with a brief system
      status message. This is a test job for validating Ollama engine routing.
      Keep the response under 100 words.
