# Persona: autofix-executor
# Focused implementer for approved auto-ready tasks

persona: autofix-executor

engine:
  default: claude-code
  model: sonnet
  fallback: null

limits:
  max_turns: 20
  max_budget_usd: 2.00
  timeout_minutes: 15

output:
  format: json
  save_to: .claude/logs/headless/executions/

session:
  persist: false
