# Persona: task-investigator
# Investigates auto:candidate tasks and promotes/blocks them

persona: task-investigator

engine:
  default: claude-code
  model: sonnet
  fallback: null

limits:
  max_turns: 20
  max_budget_usd: 1.50
  timeout_minutes: 12

output:
  format: json
  save_to: .claude/logs/headless/executions/

session:
  persist: false
